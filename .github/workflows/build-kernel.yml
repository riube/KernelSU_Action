name: Build Kernel A14 5G ZIP-Method
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 python-is-python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi wget git clang lld

      - name: Download Kernel (Direct ZIP)
        run: |
          # Baixando como ZIP para ignorar erro de Username/Senha
          wget https://github.com/D-S-Y/android_kernel_samsung_a14x/archive/refs/heads/u7.zip
          unzip u7.zip
          mv android_kernel_samsung_a14x-u7 kernel-source

      - name: Setup KernelSU & SUSFS
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          wget https://raw.githubusercontent.com/dakkshesh07/php/master/ksu_susfs.patch
          patch -p1 < ksu_susfs.patch || true

      - name: Build Kernel (Fix 16MB Image)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out a14x_eur_open_defconfig
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld

      - name: Pack Result
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-A14-KSU-Final.zip *

      - name: Upload Final
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14
          path: Kernel-A14-KSU-Final.zip
