name: Build Kernel Samsung via Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl patch

      - name: Baixar Kernel do Release
        run: |
          # Esse comando baixa o arquivo que voce subiu no Release v1.0
          curl -L -o Kernel.tar.gz https://github.com/${{ github.repository }}/releases/download/v1.0/Kernel.tar.gz
          mkdir kernel-source
          tar -xf Kernel.tar.gz -C kernel-source

      - name: Injetar KSU + Patches SUSFS
        run: |
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git patches
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Aplica os patches v2.0.0 (JIMSTERINO/WILDJAMES)
          cp ../patches/ksu/susfs_fix_patches/v2.0.0/*.patch ./
          for p in *.patch; do patch -p1 < "$p" || true; done
          patch -p1 < ../patches/69_hide_stuff.patch || true

      - name: Build Turbo
        run: |
          cd kernel-source
          # Tenta o defconfig da Samsung ou o GKI
          make ARCH=arm64 O=out a14x_defconfig || make ARCH=arm64 O=out gki_defconfig
          
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-w"

      - name: Pack Final
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/Image.gz || cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-Samsung.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Pronto
          path: Kernel-A14-Samsung.zip
