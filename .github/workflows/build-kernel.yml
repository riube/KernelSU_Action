name: Build Kernel A14 5G Final (init_boot)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev libncurses-dev gperf gcc-aarch64-linux-gnu

      - name: Baixar Kernel (Discord Direct)
        run: |
          curl -L "https://cdn.discordapp.com/attachments/1485446205118091346/1488837735320915998/Kernel.tar.gz?ex=69ce3bb1&is=69ccea31&hm=d6f4b6aa6928bdefec763a8c3507122b0522674f64b4367efdd15c4e60e45edc&" -o kernel.tar.gz
          tar -xf kernel.tar.gz

      - name: Injetar KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Aplicar Patches SUSFS (O MESMO DE ANTES)
        run: |
          # Clonando exatamente como estava na build de 20 minutos
          git clone https://gitlab.com/cyluun/susfs4kernel.git
          cp susfs4kernel/kernel_patches/5.15/* ./kernel/ || true
          patch -p1 < susfs4kernel/kernel_patches/fs/susfs.patch || true

      - name: Compilar Kernel (Android 15 / A14 5G)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out gki_defconfig
          
          # Ajustes para o seu init_boot de 16MB
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -e KERNEL_LZ4
          
          make O=out -j$(nproc)

      - name: Gerar Arquivo Image
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ./Image-A14-GKI
            lz4 -f -l out/arch/arm64/boot/Image ./Image.lz4
          else
            echo "Erro: Compilação falhou."
            exit 1
          fi

      - name: Enviar Kernel Pronto
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Final-Diego
          path: |
            ./Image-A14-GKI
            ./Image.lz4
