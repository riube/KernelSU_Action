name: Build Kernel A14 5G - FIX FINAL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel (Base 5.15-android13)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-source

      - name: Injetar Patches e KSU
        run: |
          cd kernel-source
          # 1. Instala o KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. RESOLVE ERRO DE 20 MINUTOS (O que estava no repo dele)
          # Criamos os headers que o KernelSU 5.15 exige
          mkdir -p drivers/kernelsu/uapi
          echo "#ifndef _UAPI_KSU_APP_PROFILE_H" > drivers/kernelsu/uapi/app_profile.h
          echo "#define _UAPI_KSU_APP_PROFILE_H" >> drivers/kernelsu/uapi/app_profile.h
          echo "#endif" >> drivers/kernelsu/uapi/app_profile.h
          
          # 3. MATA O HDRTEST (O erro de 30 segundos dos seus prints)
          sed -i 's/docker-test//g' Makefile || true
          sed -i '/PHONY += headers_check/d' Makefile || true
          sed -i '/scripts\/Makefile.headersinst/d' Makefile || true

      - name: Build Turbo (Pulando validações)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # Usando flags de força bruta para não parar em nenhum erro bobo
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            KBUILD_CC_WITH_CHECK=0 \
            headers_install=0 \
            CHECK_HEADERS=0 \
            WERROR=0 \
            KCFLAGS="-w" \
            KBUILD_CFLAGS="-w"

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-KSU-Final.zip *

      - name: Upload
        uses: upload-artifact@v4
        with:
          name: Kernel-Download
          path: Kernel-A14-KSU-Final.zip
