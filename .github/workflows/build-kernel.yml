name: Build Kernel A14 5G - CORRECAO FINAL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Advanced Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl wget

      - name: Download Kernel GKI 5.15
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KSU + SUSFS (Silent Patch)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          wget https://raw.githubusercontent.com/sidex15/ksu_susfs/main/ksu_susfs.patch
          # O "|| true" garante que se o patch der um aviso bobo, ele nao pare a build
          patch -p1 < ksu_susfs.patch || true

      - name: Build Kernel (Com Fix de Erro)
        run: |
          cd kernel-source
          # Adicionamos o comando para ignorar avisos que viram erros (WERROR=0)
          make ARCH=arm64 O=out gki_defconfig
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            KCFLAGS="-Wno-error" \
            WERROR=0

      - name: Pack para 16MB (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r9 ../Kernel-A14-Final-Pronto.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Final
          path: Kernel-A14-Final-Pronto.zip
