name: Build Kernel A14 5G - FIX TOTAL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel Puro (Google GKI)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KSU + Limpeza
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          # Remove a linha que causou o erro de 21 minutos pra garantir
          find drivers/kernelsu -type f -exec sed -i '/app_profile.h/d' {} + || true

      - name: Build Kernel (FORÇA BRUTA)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # AQUI ESTÁ O PULO DO GATO:
          # headers_install=0 e KBUILD_CC_WITH_CHECK=0 matam o erro do seu print
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            KBUILD_CC_WITH_CHECK=0 \
            headers_install=0 \
            CHECK_HEADERS=0 \
            WERROR=0 \
            KCFLAGS="-Wno-error -w" \
            KBUILD_CFLAGS="-Wno-error -w"

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Verifica se o arquivo foi gerado e prepara o zip
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          elif [ -f kernel-source/out/arch/arm64/boot/Image ]; then
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Resultado
          path: Kernel-A14-Final.zip
