name: Build Kernel A14 5G - BASE 5.15-13
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel Correto (GKI 5.15-android13)
        run: |
          # Aqui esta o ajuste para a versao do seu kernel real
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-source

      - name: Inject KernelSU + Fix do Arquivo Faltante
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Criando o arquivo que causou o erro fatal aos 20 minutos
          mkdir -p drivers/kernelsu/uapi
          touch drivers/kernelsu/uapi/app_profile.h

      - name: Build Kernel (Configuração do A14)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          # Compilando com as travas de erro desligadas para nao travar em 30s
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-Wno-error -w"

      - name: Pack Final (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-A15-KSU.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Resultado
          path: Kernel-A14-A15-KSU.zip
