name: Build Kernel A14 5G
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev libncurses-dev gperf

      - name: Baixar Kernel Original
        run: |
          curl -L "https://gofile.io/d/n3qWKY" -o kernel.tar.gz
          tar -xf kernel.tar.gz || echo "Erro no tar, tentando baixar direto..."
          # Se o GoFile barrar o download direto, ele vai tentar de novo aqui
          if [ ! -d "kernel" ]; then
            curl -L "https://gofile.io/d/n3qWKY" -o kernel.tar.gz
            tar -xf kernel.tar.gz
          fi

      - name: Configurar KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Aplicar Patches SUSFS
        run: |
          git clone https://gitlab.com/burasaka/susfs4kernel.git
          cp susfs4kernel/kernel_patches/5.15/* ./kernel/ || true
          patch -p1 < susfs4kernel/kernel_patches/fs/susfs.patch || true

      - name: Compilar Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out gki_defconfig
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          make O=out -j$(nproc)

      - name: Preparar Image Final
        run: |
          cp out/arch/arm64/boot/Image ./Image-A14-Final

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A15-Pronto
          path: ./Image-A14-Final
