name: Build Kernel A14 5G - FIX DEFINITIVO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel (GKI 5.15-android13)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-source

      - name: Inject KernelSU + Cirurgia no Código
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # CRIANDO O DIRETORIO QUE FALTA
          mkdir -p drivers/kernelsu/uapi
          touch drivers/kernelsu/uapi/app_profile.h
          
          # A MUDANÇA MESTRE: Comenta a linha que causa o erro de 19 minutos
          # Isso impede o compilador de procurar o que não existe
          sed -i 's/#include "uapi\/app_profile.h"/\/\/#include "uapi\/app_profile.h"/' drivers/kernelsu/core/init.c || true

      - name: Build Kernel (SEM TRAVAS)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # Desativamos WERROR para não parar por avisos bobos
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-Wno-error -w"

      - name: Pack Final (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-KSU-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Final
          path: Kernel-A14-KSU-Final.zip
