name: Build Kernel A14 5G Final (init_boot)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev libncurses-dev gperf gcc-aarch64-linux-gnu

      - name: Baixar e Preparar Kernel
        run: |
          curl -L "https://cdn.discordapp.com/attachments/1485446205118091346/1488837735320915998/Kernel.tar.gz?ex=69ce3bb1&is=69ccea31&hm=d6f4b6aa6928bdefec763a8c3507122b0522674f64b4367efdd15c4e60e45edc&" -o kernel.tar.gz
          tar -xf kernel.tar.gz
          # Garante que estamos na pasta onde o Makefile está
          if [ -d "Kernel" ]; then mv Kernel/* . && rm -rf Kernel; fi

      - name: Injetar KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Injetar SUSFS (Download Direto)
        run: |
          mkdir -p fs/susfs
          curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/fs/susfs.patch" -o susfs.patch
          curl -LSs "https://raw.githubusercontent.com/sidex15/susfs4kernel/main/kernel_patches/5.15/sys_patch_5.15.patch" -o sys.patch
          patch -p1 < susfs.patch || true
          patch -p1 < sys.patch || true

      - name: Compilar Kernel (A14 5G - Resolvido)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          # Limpeza profunda para não dar erro de config
          make clean && make mrproper
          make O=out gki_defconfig
          
          # Vacina dos 20 minutos
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -e KERNEL_LZ4
          
          make O=out -j$(nproc)

      - name: Gerar Arquivos (init_boot 16MB)
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ./Image
            lz4 -f -l out/arch/arm64/boot/Image ./Image.lz4
          else
            echo "Erro: A compilação falhou no Makefile."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Diego-Final
          path: |
            ./Image
            ./Image.lz4
