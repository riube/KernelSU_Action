name: Build Kernel A14 5G - RESOLUCAO TOTAL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel (Base 5.15-android13)
        run: |
          # Usando a base exata que voce confirmou
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-source

      - name: Inject KSU + Limpeza Automática
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # COMANDO QUE RESOLVE O ERRO DE 20 MINUTOS:
          # Deleta qualquer linha que chame o app_profile.h ou klog.h em todo o KernelSU
          find drivers/kernelsu -type f -exec sed -i '/app_profile.h/d' {} + || true
          find drivers/kernelsu -type f -exec sed -i '/klog.h/d' {} + || true

      - name: Build Kernel (MODO FINAL)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # Flags para ignorar os erros de HDRTEST (30 segundos) e seguir ate o fim
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            KBUILD_CC_WITH_CHECK=0 \
            headers_install=0 \
            WERROR=0 \
            KCFLAGS="-Wno-error -w" \
            KBUILD_CFLAGS="-Wno-error -w"

      - name: Pack Final (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-KSU-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Resultado
          path: Kernel-A14-KSU-Final.zip
