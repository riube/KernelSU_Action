name: Build Kernel A14 5G - MODO RESGATE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel Puro (Google GKI)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KernelSU + Patch de Compatibilidade
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # FIX REAL: O KernelSU novo pede esse diretório uapi. Vamos criar e dar um arquivo vazio pra ele.
          mkdir -p drivers/kernelsu/uapi
          echo "/* Empty profile for GKI compatibility */" > drivers/kernelsu/uapi/app_profile.h
          
          # Garante que o compilador ache o caminho dos arquivos novos
          sed -i 's/EXTRA_CFLAGS += -I$(srctree)\/drivers\/kernelsu/EXTRA_CFLAGS += -I$(srctree)\/drivers\/kernelsu -I$(srctree)\/drivers\/kernelsu\/uapi/' drivers/kernelsu/Makefile || true

      - name: Build Kernel (MODO FORÇA BRUTA)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # Voltando aos comandos que deixam a build correr solta
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-Wno-error -w" \
            KBUILD_CFLAGS="-Wno-error -w"

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Se chegar aqui, a build foi um sucesso
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-A14-GKI-KSU.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Final
          path: Kernel-A14-GKI-KSU.zip
