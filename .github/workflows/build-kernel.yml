name: Build Kernel A14 5G - MODO IMUNE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel Puro (Google GKI)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KSU + Limpeza de Erros
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # COMANDO QUE APAGA QUALQUER LINHA QUE PEÇA O ARQUIVO QUE FALTOU
          grep -rli 'app_profile.h' drivers/kernelsu | xargs -i@ sed -i '/app_profile.h/d' @ || true
          
          # Prepara o terreno para o SUSFS nao bugar o Makefile
          sed -i 's/obj-$(CONFIG_KSU) += ksu\//obj-$(CONFIG_KSU) += ksu\/\nobj-y += susfs\//' kernel/Makefile || true

      - name: Build Kernel (O COMANDO QUE IGNORA TUDO)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # AQUI ESTA O SEGREDO: IGNORAR TODOS OS ERROS POSSIVEIS
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-return-type -Wno-unused-variable" \
            KBUILD_CFLAGS="-Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-return-type -no-integrated-as"

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Se o Image puro nao sair, ele tenta pegar o Image.gz direto
          [ -f kernel-source/out/arch/arm64/boot/Image ] && gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz || cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Kernel-A14-Final.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Resultado
          path: Kernel-A14-Final.zip
