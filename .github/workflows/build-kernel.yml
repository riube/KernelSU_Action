name: Build Kernel A14 5G Final (init_boot)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev libncurses-dev gperf gcc-aarch64-linux-gnu wget unzip

      - name: Download e Unificação Total
        run: |
          # Baixa o kernel de 244MB
          curl -L "https://cdn.discordapp.com/attachments/1485446205118091346/1488837735320915998/Kernel.tar.gz?ex=69ce3bb1&is=69ccea31&hm=d6f4b6aa6928bdefec763a8c3507122b0522674f64b4367efdd15c4e60e45edc&" -o kernel.tar.gz
          tar -xf kernel.tar.gz
          
          # Mover TUDO de qualquer subpasta para a raiz do projeto
          find . -mindepth 2 -type f -exec mv -t . {} +
          echo "Arquivos unificados na raiz."

      - name: Injetar KernelSU Next
        run: |
          # Como unificamos, o setup roda direto aqui
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: SUSFS via ZIP (Sem erro de Login)
        run: |
          # Wget não pede senha, resolvendo os erros das imagens 9e7ee4 e 9e89f0
          wget https://github.com/sidex15/susfs4kernel/archive/refs/heads/main.zip -O susfs.zip
          unzip susfs.zip
          cp -r susfs4kernel-main/kernel_patches/* .
          # Aplica o patch de integridade
          patch -p1 < fs/susfs.patch || true

      - name: Compilar (A14 5G - Sem Erro de Pasta)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Agora ele acha o gki_defconfig porque está na raiz
          make O=out gki_defconfig
          
          # Vacina contra o erro dos 20 minutos (estouro de disco)
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          scripts/config --file out/.config -e KERNEL_LZ4
          
          make O=out -j$(nproc)

      - name: Gerar Image
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            lz4 -f -l out/arch/arm64/boot/Image ./Image.lz4
          else
            echo "Falha crítica: O kernel não compilou."
            exit 1
          fi

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Diego-Final
          path: ./Image.lz4
