name: Build Kernel Direto do KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download GKI Kernel (Fonte Oficial 5.15)
        run: |
          # Baixando a base 5.15 direto do Google/Android (Link que nunca cai)
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KernelSU (Oficial)
        run: |
          cd kernel-source
          # Comando oficial do site do KernelSU para injetar o codigo
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Build Kernel (A14 5G)
        run: |
          cd kernel-source
          # Usando a config padrao para kernel 5.15
          make ARCH=arm64 O=out gki_defconfig
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld

      - name: Pack Image.gz (Para 16MB)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          # Comprimindo para Image.gz para caber na sua particao
          gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r9 ../Kernel-KSU-Oficial.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-KSU
          path: Kernel-KSU-Oficial.zip
