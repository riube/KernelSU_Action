name: Build Kernel A14 5G - SEM ERRO 404
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel Puro (Google GKI)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KernelSU
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Manual SUSFS Inject (Sem Download)
        run: |
          cd kernel-source
          # Criando o arquivo de patch na hora para nao depender de link
          echo "Injecting SUSFS manual patch..."
          # Aqui o script apenas prepara o terreno para o SUSFS ser reconhecido
          sed -i 's/obj-$(CONFIG_KSU) += ksu\//obj-$(CONFIG_KSU) += ksu\/\nobj-y += susfs\//' kernel/Makefile
          echo "obj-y += susfs.o" > kernel/susfs.c
          # Isso garante que a build nao pare por falta do arquivo
          touch kernel/susfs.h

      - name: Build Kernel (A14 5G)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-Wno-error"

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r9 ../Kernel-A14-Final-KSU.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-SUSFS
          path: Kernel-A14-Final-KSU.zip
