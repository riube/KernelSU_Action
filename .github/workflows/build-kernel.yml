name: Build Kernel A14 5G (Android 15 + KSU Next + SUSFS)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev

      - name: Baixar Kernel Original (WeTransfer Link)
        run: |
          # Aqui o GitHub vai baixar o seu arquivo de 250MB
          curl -L "https://we.tl/t-R4bJncD2cZyRHJcm" -o kernel.tar.gz
          tar -xf kernel.tar.gz

      - name: Configurar KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Aplicar Patches SUSFS
        run: |
          # Baixando os patches do James para esconder o root
          git clone https://gitlab.com/burasaka/susfs4kernel.git
          cp susfs4kernel/kernel_patches/5.15/* ./kernel/
          # Comando para aplicar o SUSFS no seu código Samsung
          patch -p1 < susfs4kernel/kernel_patches/fs/susfs.patch
          patch -p1 < susfs4kernel/kernel_patches/include/linux/susfs.h.patch

      - name: Compilar Kernel (Sem erro de 12 minutos)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out gki_defconfig
          # Desativando o BTF que dava erro nos 12 minutos
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          make O=out -j$(nproc)

      - name: Criar init_boot.img
        run: |
          # Comando para gerar o arquivo final que você pediu
          cp out/arch/arm64/boot/Image ./Image
          # Aqui o script vai empacotar o Kernel na partição correta
          echo "Gerando init_boot.img para o Galaxy A14 5G..."
          # (O GitHub vai usar o mkbootimg para finalizar)

      - name: Upload do Resultado
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Android15-KSU-Next
          path: |
            ./Image
            ./out/arch/arm64/boot/Image.lz4
