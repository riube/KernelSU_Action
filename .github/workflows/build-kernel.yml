name: Build Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Configuration
        run: |
          echo "SOURCE_URL=$(grep KERNEL_SOURCE config.env | cut -d'=' -f2)" >> $GITHUB_ENV
          echo "SOURCE_BRANCH=$(grep KERNEL_SOURCE_BRANCH config.env | cut -d'=' -f2)" >> $GITHUB_ENV
          echo "CONFIG_FILE=$(grep KERNEL_CONFIG config.env | cut -d'=' -f2)" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 python-is-python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang (ZyCromerZ)
        run: |
          mkdir clang
          cd clang
          wget https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20220904/Clang-14.0.6-20220904.tar.gz
          tar -xf *.tar.gz

      - name: Checkout Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.SOURCE_BRANCH }} ${{ env.SOURCE_URL }} kernel-source

      - name: Setup KernelSU & SUSFS
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          wget https://raw.githubusercontent.com/dakkshesh07/php/master/ksu_susfs.patch
          patch -p1 < ksu_susfs.patch || true

      - name: Build Kernel
        run: |
          cd kernel-source
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make ARCH=arm64 O=out ${{ env.CONFIG_FILE }}
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../AnyKernel3-A14-KSU-SUSFS.zip *

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-KSU-SUSFS
          path: AnyKernel3-A14-KSU-SUSFS.zip
