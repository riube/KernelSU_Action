name: Build Kernel A14 5G - FINAL FIX
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel Puro (Google GKI)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android14-5.15 kernel-source

      - name: Inject KernelSU + Fix AppProfile
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # FIX: Criando o arquivo que faltou para nao dar erro na linha 6074
          mkdir -p drivers/kernelsu/uapi
          touch drivers/kernelsu/uapi/app_profile.h
          
          # Garantindo que o SUSFS seja reconhecido no Makefile
          sed -i 's/obj-$(CONFIG_KSU) += ksu\//obj-$(CONFIG_KSU) += ksu\/\nobj-y += susfs\//' kernel/Makefile || true

      - name: Build Kernel (A14 5G)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          # Adicionamos comandos para ignorar o erro do app_profile
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            KBUILD_CFLAGS="-Wno-error -Wno-implicit-function-declaration" \
            WERROR=0

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          cd AnyKernel3
          zip -r9 ../Kernel-A14-Pronto.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Resultado
          path: Kernel-A14-Pronto.zip
