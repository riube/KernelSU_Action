name: Build Kernel A14 5G - MODO JIMSTERINO
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel (Base 5.15-android13)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-source

      - name: Aplicar Patches do Jimsterino
        run: |
          # Clona o repo que voce achou
          git clone https://github.com/jimsterino98/ksu_susfs_patches.git
          cd kernel-source
          
          # Injeta o KernelSU oficial
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # APLICANDO OS FIXES (O segredo do sucesso)
          # Isso aqui resolve o erro do app_profile.h e do klog.h de um jeito limpo
          cp -r ../ksu_susfs_patches/ksu/susfs_fix_patches/v2.0.0/* ./
          for patch in *.patch; do patch -p1 < "$patch" || true; done
          
          # Mata o HDRTEST (o erro de 30 segundos) direto no Makefile
          sed -i '/PHONY += headers_check/d' Makefile || true
          sed -i '/scripts\/Makefile.headersinst/d' Makefile || true

      - name: Build Kernel (Agora vai!)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-w"

      - name: Pack Final (Image.gz)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-Jimsterino-A14.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14-Final
          path: Kernel-Jimsterino-A14.zip
