name: Build Kernel A14 5G - SEM TESTE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential bison flex libssl-dev libelf-dev python3 zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang lld curl

      - name: Download Kernel (Base 5.15-android13)
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android13-5.15 kernel-source

      - name: Cirurgia no Makefile (Mata o HDRTEST)
        run: |
          cd kernel-source
          # Esse comando deleta a linha que obriga o kernel a testar os headers
          sed -i '/PHONY += headers_check/d' Makefile || true
          sed -i '/scripts\/Makefile.headersinst/d' Makefile || true
          
          # Injeta o KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Fix do erro de 20 min (app_profile e klog)
          find drivers/kernelsu -type f -exec sed -i '/app_profile.h/d' {} + || true
          find drivers/kernelsu -type f -exec sed -i '/klog.h/d' {} + || true

      - name: Build Real (Sem enrolação)
        run: |
          cd kernel-source
          make ARCH=arm64 O=out gki_defconfig
          
          # Compilação direta sem passar pelo fiscal de headers
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LD=ld.lld \
            WERROR=0 \
            KCFLAGS="-w"

      - name: Pack Final
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          if [ -f kernel-source/out/arch/arm64/boot/Image.gz ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            gzip -c kernel-source/out/arch/arm64/boot/Image > AnyKernel3/Image.gz
          fi
          cd AnyKernel3
          zip -r9 ../Kernel-Pronto.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A14
          path: Kernel-Pronto.zip
