name: Build Kernel A14 5G Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Ferramentas de Compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev libncurses-dev gperf gcc-aarch64-linux-gnu

      - name: Baixar Kernel Original
        run: |
          curl -L "https://limewire.com/d/h1JDt" -o kernel.tar.gz
          tar -xf kernel.tar.gz
          echo "Kernel extraído com sucesso!"

      - name: Configurar KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Aplicar Patches SUSFS
        run: |
          git clone https://gitlab.com/burasaka/susfs4kernel.git
          # Aplicando patches para a base 5.15
          cp susfs4kernel/kernel_patches/5.15/* ./kernel/ || true
          patch -p1 < susfs4kernel/kernel_patches/fs/susfs.patch || true

      - name: Compilar Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out gki_defconfig
          
          # Desativar BTF para não travar nos 12 minutos
          scripts/config --file out/.config -d DEBUG_INFO_BTF
          
          make O=out -j$(nproc)

      - name: Gerar Arquivo Final
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ./Image-A14-Final-Diego
          else
            echo "Erro: Arquivo Image não encontrado."
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A15-Diego-Pronto
          path: ./Image-A14-Final-Diego
